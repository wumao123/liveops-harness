name: Verify offline harness

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install -e '.[dev]' --no-deps
          .venv/bin/python -m pip check
      - name: Tests and regression gate
        run: .venv/bin/python tools/regression_gate.py
      - name: HTTP, restart, remote recovery and background campaign smoke
        run: .venv/bin/python tools/http_smoke.py
