[project]
name = "liveops-harness"
version = "0.1.0"
description = "A resumable, auditable agent harness for a simulated live commerce control room"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liveops*"]

[tool.setuptools.package-data]
liveops = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
